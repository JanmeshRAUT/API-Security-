server.port=8085

spring.application.name=api-security-platform

# Supabase PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.bxvqyprgsiubhdctfehs.supabase.co:5432/postgres?sslmode=require}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Janmesh@2312}

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# AI Service Integration
api.security.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
api.security.ai.api-key=${AI_SERVICE_API_KEY:development-secret}
api.security.ai.connect-timeout-ms=1000
api.security.ai.read-timeout-ms=2000

# Logging
logging.level.root=INFO
logging.level.com.apisecurity.platform=DEBUG
